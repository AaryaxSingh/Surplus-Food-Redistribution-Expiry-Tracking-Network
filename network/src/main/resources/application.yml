spring:
  application:
    name: food-rescue-network
  profiles:
    active: dev

# DEV PROFILE (local testing with H2)
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:foodrescuedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: root
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# PROD PROFILE (Live Server with PostgreSQL)
spring:
  config:
    activate:
      on-profile: prod 

  datasource: 
     # Read from environment variables set on your production server / Docker
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/foodrescuedb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa: 
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

server:
  port: ${PORT:8080}

    



